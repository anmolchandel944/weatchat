<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Contact Us - WeatChat</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
    rel="stylesheet">

    <style>
        html,
        body{
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        body{
            background:
            linear-gradient(
            270deg,
            #0a0a0a,
            #1a1a2e,
            #0f172a,
            #1e1133
            );
            background-size: 400% 400%;
            animation:
            gradientShift 25s ease infinite;
            min-height: 100dvh;
            position: relative;
            color: white;
            font-family: sans-serif;
        }

        @keyframes gradientShift{
            0%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100% 50%;
            }
            100%{
                background-position: 0% 50%;
            }
        }

        .glass{
            background:
            rgba(255, 255, 255, 0);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(12px);
            border:
            1px solid rgba(255, 255, 255, 0.137);
        }

        .logo-text{
            font-family:
            'Space Grotesk',
            sans-serif;
            font-weight: 700;
        }

        #emoji-bg{
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .emoji{
            position: absolute;
            bottom: -100px;
            font-size: 24px;
            opacity: 0.25;
            user-select: none;
            z-index: 0;
            animation:
            floatUp linear forwards;
            will-change: transform;
        }
        @keyframes floatUp{
            0%{
                transform:
                translateY(0)
                rotate(0deg);
                opacity: 0;
            }
            10%{
                opacity: 0.25;
            }
            100%{
                transform:
                translateY(-130vh)
                rotate(35deg);
                opacity: 0;
            }
        }

        @media(max-width:768px){
            .glass{
                backdrop-filter: blur(8px);
            }
        }

    </style>
</head>

<body>

    <div id="emoji-bg"></div>

    <div class="relative z-10 min-h-[100dvh] flex items-center justify-center px-4 py-8">

        <div class="w-full max-w-lg mx-auto">

            <!-- HEADER -->

            <div class="flex items-center justify-center gap-3 mb-8">
                <div class="w-11 h-11 bg-gradient-to-br from-cyan-400 to-violet-400 rounded-3xl flex items-center justify-center shadow-lg">
                    <i class="ri-chat-smile-2-line text-3xl text-black"></i>
                </div>
                 <h2 class="logo-text">WeatChat</h2>
            </div>

            <!-- CONTACT CARD -->

            <div class="glass rounded-3xl p-6 sm:p-10 shadow-2xl">
                <h2 class="text-3xl sm:text-4xl font-semibold text-center mb-2">
                    Get in Touch
                </h2>
                <p class="text-slate-400 text-center mb-8 text-sm sm:text-base">
                    Any problem or suggestion?
                    We're happy to help!
                </p>

                <!-- CONTACT FORM -->

                <form
                action="https://formspree.io/f/mrbkbepg"
                method="POST"
                class="space-y-5 sm:space-y-6">
                    <!-- NAME -->
                    <div>
                        <label class="block text-sm text-slate-400 mb-2">
                            Your Name
                        </label>
                        <input
                        type="text"
                        name="name"
                        required
                        class="w-full glass rounded-2xl px-5 py-4 outline-none focus:border-cyan-400 transition-all"
                        placeholder="Enter your name">
                    </div>

                    <!-- EMAIL -->

                    <div>
                        <label class="block text-sm text-slate-400 mb-2">
                            Email Address
                        </label>
                        <input
                        type="email"
                        name="email"
                        required
                        class="w-full glass rounded-2xl px-5 py-4 outline-none focus:border-cyan-400 transition-all"
                        placeholder="your@email.com">
                    </div>

                    <!-- MESSAGE -->

                    <div>
                        <label class="block text-sm text-slate-400 mb-2">
                            Your Message
                        </label>
                        <textarea
                        name="message"
                        rows="5"
                        required
                        class="w-full glass rounded-3xl px-5 py-4 outline-none focus:border-cyan-400 transition-all resize-none"
                        placeholder="Write your message here..."></textarea>
                    </div>

                    <!-- HIDDEN -->

                    <input type="hidden"
                    name="_subject"
                    value="New Contact Message from WeatChat">
                    <input type="hidden"
                    name="_next"
                    value="https://anmolchandel944.github.io/weatchat/contact.html?success=true">

                    <!-- BUTTON -->

                    <button
                    type="submit"
                    class="w-full bg-gradient-to-r from-cyan-400 to-violet-400 text-black font-semibold py-4 rounded-3xl text-lg hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-3">
                        <i class="ri-send-plane-fill"></i>
                        Send Message
                    </button>
                </form>

                <!-- CONTACT INFO -->

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-10">
                    <div class="glass rounded-2xl p-5 text-center">
                        <i class="ri-mail-line text-3xl text-cyan-400 mb-3"></i>
                        <p class="font-medium">
                            Email
                        </p>
                        <p class="text-slate-400 text-sm">
                            Not Provided Now
                        </p>
                    </div>

                    <div class="glass rounded-2xl p-5 text-center">
                        <i class="ri-instagram-line text-3xl text-cyan-400 mb-3"></i>
                        <p class="font-medium">
                            Instagram
                        </p>
                        <p class="text-slate-400 text-sm">
                            Not Provided Now
                        </p>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->

            <p class="text-center text-slate-500 text-xs sm:text-sm mt-8">
                © <span id="year"></span>
                WeatChat |
                Made with ❤️ by Anmol
            </p>
        </div>
    </div>

 
    <script>

        /* YEAR */

        document.getElementById("year")
        .textContent =
        new Date().getFullYear();



        /* =====================================
           FLOATING EMOJIS
        ===================================== */

        const emojis = [

            "💬","🔥","💔","✨","🚀",
            "😎","💻","😘","📱","❤️",
            "😏","👀","🎯","🤭","🌟","💡"

        ];
        const emojiBg =
        document.getElementById("emoji-bg");

        function createEmoji(){

            const emoji =
            document.createElement("div");
            emoji.className = "emoji";
            emoji.innerText =
            emojis[Math.floor(
            Math.random() * emojis.length
            )];


            /* RANDOM POSITION */

            emoji.style.left =
            Math.random() * 100 + "vw";


            /* RANDOM SIZE */

            emoji.style.fontSize =
            (18 + Math.random() * 28) + "px";


            /* RANDOM SPEED */

            emoji.style.animationDuration =
            (8 + Math.random() * 10) + "s";

            /* RANDOM OPACITY */

            emoji.style.opacity =
            (0.15 + Math.random() * 0.3);
            emojiBg.appendChild(emoji);

            /* REMOVE AFTER ANIMATION */

            setTimeout(() => {
                emoji.remove();
            }, 18000);
        }

        /* START ANIMATION */

        setInterval(createEmoji, 500);

        /* SUCCESS MESSAGE */

        const urlParams =
        new URLSearchParams(window.location.search);
        if(urlParams.get('success') === 'true'){
            setTimeout(() => {
                alert(
                "✅ Thank you! Your message has been sent successfully."
                );
            }, 600);
        }
    </script>

</body>
</html>
