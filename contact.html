<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - WeatChat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: linear-gradient(270deg, #0a0a0a, #1a1a2e, #0f172a, #1e1133);
            background-size: 400% 400%;
            animation: gradientShift 25s ease infinite;
            min-height: 100dvh;
        }
        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
        }
    </style>
</head>
<body class="text-white font-sans">

    <div class="min-h-[100dvh] flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-lg mx-auto">

            <!-- Back Button -->
            <!-- <a href="index.html" class="inline-flex items-center gap-2 text-cyan-400 hover:text-white mb-6 transition-colors text-sm font-medium">
                <i class="ri-arrow-left-line text-xl"></i>
                <span>Back to WeatChat</span>
            </a> -->

            <!-- Header -->
            <div class="flex items-center justify-center gap-3 mb-8">
                <div class="w-11 h-11 bg-gradient-to-br from-cyan-400 to-violet-400 rounded-3xl flex items-center justify-center shadow-lg">
                    <i class="ri-chat-smile-2-line text-3xl text-black"></i>
                </div>
                <h1 class="logo-text text-4xl tracking-tight">WeatChat</h1>
            </div>

            <div class="glass rounded-3xl p-6 sm:p-10 border border-white/10 shadow-2xl">
                <h2 class="text-3xl sm:text-4xl font-semibold text-center mb-2">Get in Touch</h2>
                <p class="text-slate-400 text-center mb-8 text-sm sm:text-base">
                    Any problem or suggestion? We're happy to help!
                </p>

                <!-- Formspree Form with Fixed Subject -->
                <form id="contact-form" action="https://formspree.io/f/mrbkbepg" method="POST" class="space-y-5 sm:space-y-6">
                    
                    <div>
                        <label class="block text-sm text-slate-400 mb-2">Your Name</label>
                        <input type="text" name="name" required
                               class="w-full glass border border-white/10 rounded-2xl px-5 py-4 outline-none focus:border-cyan-400 transition-all text-base"
                               placeholder="Enter your name">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-2">Email Address</label>
                        <input type="email" name="email" required
                               class="w-full glass border border-white/10 rounded-2xl px-5 py-4 outline-none focus:border-cyan-400 transition-all text-base"
                               placeholder="your@email.com">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-2">Your Message</label>
                        <textarea name="message" rows="5" required
                                  class="w-full glass border border-white/10 rounded-3xl px-5 py-4 outline-none focus:border-cyan-400 transition-all resize-none text-base"
                                  placeholder="Write your message here..."></textarea>
                    </div>

                    <!-- FIXED SUBJECT (User cannot change this) -->
                    <input type="hidden" name="_subject" value="New Contact Message from WeatChat">
                    <input type="hidden" name="_next" value="https://anmolchandel944.github.io/weatchat/contact.html?success=true">

                    <button type="submit"
                            class="w-full bg-gradient-to-r from-cyan-400 to-violet-400 text-black font-semibold py-4 sm:py-5 rounded-3xl text-lg hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-3">
                        <i class="ri-send-plane-fill"></i>
                        Send Message
                    </button>
                </form>

                <!-- Contact Info -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-10">
                    <div class="glass rounded-2xl p-5 text-center">
                        <i class="ri-mail-line text-3xl text-cyan-400 mb-3"></i>
                        <p class="font-medium">Email</p>
                        <a href="mailto:gmail.com" class="text-slate-400 hover:text-cyan-300 text-sm">Not Provided Now</a>
                    </div>
                    <div class="glass rounded-2xl p-5 text-center">
                        <i class="ri-instagram-line text-3xl text-cyan-400 mb-3"></i>
                        <p class="font-medium">Instagram</p>
                        <a href="https://instagram.com" target="_blank" class="text-slate-400 hover:text-cyan-300 text-sm">Not Provided Now </a>
                    </div>
                </div>
            </div>

            <p class="text-center text-slate-500 text-xs sm:text-sm mt-8">
                © <span id="year"></span> WeatChat | Made with ❤️ by Anmol Chandel
            </p>
        </div>
    </div>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        // Success Message
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            setTimeout(() => {
                alert("✅ Thank you! Your message has been sent successfully.\n\nWe'll reply to you soon.");
            }, 600);
        }
    </script>
</body>
</html>
